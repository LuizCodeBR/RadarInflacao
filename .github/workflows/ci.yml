name: Verificar pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Preparar ambiente fixado
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Verificar estilo e regras sem API externa
        run: |
          python -m ruff check src tests app.py
          python -m pytest
      - name: Verificar CLI e importação sem duplicação
        run: |
          python -m radar_inflacao --data-dir .cache/smoke demo
          python -m radar_inflacao --data-dir .cache/smoke demo
          python -m radar_inflacao --data-dir .cache/smoke status
