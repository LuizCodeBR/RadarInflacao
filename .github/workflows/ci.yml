name: Verificar pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Preparar ambiente fixado
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Verificar estilo e regras sem API externa
        run: |
          python -m ruff check src tests app.py scripts/package_demo.py
          python -m pytest
      - name: Verificar CLI e importação sem duplicação
        run: |
          python -m radar_inflacao --data-dir .cache/smoke demo
          python -m radar_inflacao --data-dir .cache/smoke demo
          python -m radar_inflacao --data-dir .cache/smoke status
          python -m radar_inflacao --data-dir .cache/smoke quality
          python -m radar_inflacao --data-dir .cache/smoke quality-export --output .cache/smoke-quality.csv
          python -m radar_inflacao --data-dir .cache/smoke quality-export --report changes --kind ADDED --output .cache/smoke-changes.csv
          python -m radar_inflacao --data-dir .cache/smoke export --dataset areas --areas N7:3501 N6:5300108 --from 2024-01 --to 2024-03 --output .cache/smoke-areas.csv
          python -m radar_inflacao --data-dir .cache/smoke quality-export --report changes --dataset areas --area N7:3501 --kind ADDED --output .cache/smoke-area-history.csv
          python -m radar_inflacao --data-dir .cache/smoke export --dataset indices --from 2024-01 --to 2024-03 --output .cache/smoke-indices.csv
          python -m radar_inflacao --data-dir .cache/smoke compare-indices --from 2024-01 --to 2024-03 --from-b 2023-01 --to-b 2023-03 --output .cache/smoke-indices-ab.csv
          python -m radar_inflacao --data-dir .cache/smoke quality-export --report changes --dataset inpc --kind ADDED --output .cache/smoke-inpc-history.csv
      - name: Gerar demonstração HTML e ZIP sem banco ou API
        run: |
          python -m radar_inflacao demo-html --output .cache/smoke-demo.html
          python scripts/package_demo.py --output-dir .cache/smoke-demo-package
