name: Publicar demonstração no Pages
on:
  push:
    branches: [main]
    paths:
      - 'ABRIR-DEMONSTRACAO.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter a demonstração validada
        uses: actions/checkout@v7
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente o HTML público
        shell: bash
        run: |
          mkdir -p _site
          cp ABRIR-DEMONSTRACAO.html _site/index.html
          cmp ABRIR-DEMONSTRACAO.html _site/index.html
          sha256sum _site/index.html
      - name: Enviar a página para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publicar demonstração
        id: deployment
        uses: actions/deploy-pages@v4
